plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
}

group = 'com.airz'
version = '1.0.0'

base { archivesName = 'spellwheel-1.21.1-neoforge' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = '21.1.200'
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        spellwheel { sourceSet sourceSets.main }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    compileOnly 'maven.modrinth:XvoWJaA2:IYoY9AHA'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
